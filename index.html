<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TITAN ENTERPRISE v4 | Advanced RPA Engine</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.1); }
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body {
            background: #020617;
            background-image: radial-gradient(at 0% 0%, rgba(30, 64, 175, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); }
        .status-badge { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 5 Status Colors */
        .status-inquiry { background: rgba(6, 182, 212, 0.2); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-processing { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.3); }
        .status-problem { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginPage" class="fixed inset-0 z-[500] flex items-center justify-center p-6 bg-[#020617] transition-all duration-500">
    <div class="glass-panel w-full max-w-md rounded-[40px] p-10 shadow-2xl relative overflow-hidden border-blue-500/20">
    <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-600/20 blur-[80px]"></div>
            <div class="relative z-10 text-center">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-3xl shadow-lg mb-6">
                    <i class="fas fa-shield-halved text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tighter italic text-white">TITAN <span class="text-blue-500">CORE v4</span></h1>
                <p class="text-[10px] text-slate-500 tracking-[4px] uppercase mt-2 font-bold">Authorized Access Only</p>
                
                <form id="loginForm" class="space-y-5 mt-10">
                    <input type="text" id="username" placeholder="Identity Token" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-blue-500 transition-all text-sm font-bold tracking-widest">
                    <input type="password" id="password" placeholder="Access Cipher" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-blue-500 transition-all text-sm font-bold tracking-widest">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-black text-xs uppercase tracking-[3px] shadow-xl transition-all active:scale-95">
                        Initialize System <i class="fas fa-bolt ml-2 text-yellow-400"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="dashboardPage" class="hidden flex flex-col min-h-screen">
        <header class="glass-panel sticky top-0 z-[100] px-8 py-4 flex items-center justify-between border-b border-white/5">
            <div class="flex items-center gap-4">
                <h2 class="text-2xl font-black italic tracking-tighter">TITAN <span class="text-blue-500">v4</span></h2>
                <div class="h-6 w-[1px] bg-white/10 mx-2"></div>
                <div id="userDisplay" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">--</div>
            </div>
            <button id="logoutBtn" class="bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">
                <i class="fas fa-power-off"></i> LOGOUT
            </button>
        </header>

        <main class="p-6 max-w-[1800px] mx-auto w-full space-y-6">
            
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="glass-panel p-5 rounded-3xl border-l-4 border-cyan-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Inquiry</p>
                    <h3 id="statInquiry" class="text-2xl font-black mt-1 text-cyan-400">0</h3>
                </div>
                <div class="glass-panel p-5 rounded-3xl border-l-4 border-amber-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Pending</p>
                    <h3 id="statPending" class="text-2xl font-black mt-1 text-amber-400">0</h3>
                </div>
                <div class="glass-panel p-5 rounded-3xl border-l-4 border-emerald-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Success</p>
                    <h3 id="statSuccess" class="text-2xl font-black mt-1 text-emerald-400">0</h3>
                </div>
                <div class="glass-panel p-5 rounded-3xl border-l-4 border-purple-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Processing</p>
                    <h3 id="statProcessing" class="text-2xl font-black mt-1 text-purple-400">0</h3>
                </div>
                <div class="glass-panel p-5 rounded-3xl border-l-4 border-red-500">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Problem</p>
                    <h3 id="statProblem" class="text-2xl font-black mt-1 text-red-400">0</h3>
                </div>
            </div>

            <div class="flex flex-col md:row gap-4">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="searchInput" placeholder="Search Customer, ID or Passport..." class="w-full bg-slate-900 border border-white/5 rounded-2xl pl-14 pr-6 py-4 outline-none focus:border-blue-500 transition-all font-semibold">
                </div>
                <button onclick="syncCoreDatabase()" class="bg-blue-600 px-8 py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest hover:bg-blue-500 active:scale-95 transition-all">
                    <i class="fas fa-sync-alt mr-2"></i> Cloud Sync
                </button>
            </div>

            <div class="glass-panel rounded-[32px] overflow-hidden shadow-2xl border-white/5">
    <div class="overflow-x-auto overflow-y-auto max-h-[600px]">
        <table class="w-full text-left border-collapse">
            <thead class="sticky top-0 bg-[#0f172a] z-20">
                <tr class="text-[9px] font-black uppercase text-slate-400 border-b border-white/10">
                    <th class="px-5 py-4">ID</th>
                    <th class="px-5 py-4">Date</th>
                    <th class="px-5 py-4">Updated</th>
                    <th class="px-5 py-4">Platform</th>
                    <th class="px-5 py-4">Mess. ID</th>
                    <th class="px-5 py-4">Phone</th>
                    <th class="px-5 py-4">Customer</th>
                    <th class="px-5 py-4">AI Summary</th>
                    <th class="px-5 py-4">Service</th>
                    <th class="px-5 py-4">Status</th>
                    <th class="px-5 py-4">Instruction</th>
                    <th class="px-5 py-4 text-right">Income</th>
                    <th class="px-5 py-4">Staff</th>
                    <th class="px-5 py-4 text-center">Docs</th>
                    <th class="px-5 py-4 text-right">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-white/5 text-[11px] font-semibold">
                </tbody>
        </table>
    </div>
</div>
</main>
</div>

    <div id="notificationZone" class="fixed bottom-6 right-6 z-[1000] flex flex-col gap-2"></div>

    <script src="dashboard.js"></script>

    <script>
    const loginPage = document.getElementById('loginPage');
    const dashboardPage = document.getElementById('dashboardPage');
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        
        try {
            const engine = window.TitanEngine;
            
            if (!engine || !engine.client) {
                alert("🚀 SYSTEM INITIALIZING: Please wait 2 seconds and try again.");
                return;
            }

            // डाटाबेसमा स्टाफ चेक गर्ने (यो भाग माथि छुटेको थियो)
            const { data: staff, error } = await engine.client
                .from('staff')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .single();

            if (error || !staff) {
                alert("❌ INVALID CIPHER: ACCESS DENIED");
                return;
            }

            // लगइन सफल भएपछि UI परिवर्तन गर्ने
            loginPage.style.display = 'none'; 
            dashboardPage.classList.remove('hidden');
            dashboardPage.style.display = 'flex';
            
            document.getElementById('userDisplay').innerText = `ACCESS LEVEL: ${staff.full_name}`;
            
            // डेटा सिंक सुरु गर्ने
            if (window.syncCoreDatabase) {
                window.syncCoreDatabase();
            }

        } catch (err) {
            console.error("Auth Error:", err);
            alert("SYSTEM ERROR: UNABLE TO CONNECT TO DATABASE");
        }
    });

    // लगआउट बटन
    document.getElementById('logoutBtn').addEventListener('click', () => {
        location.reload();
    });
    </script>
</body>
</html>
