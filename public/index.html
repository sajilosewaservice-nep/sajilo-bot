<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minimal TITAN Dashboard</title>
  <style>body{font-family:Inter,system-ui,Arial;background:#0f172a;color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.card{background:#0b1220;padding:32px;border-radius:12px;box-shadow:0 6px 20px rgba(2,6,23,.6);max-width:720px;width:100%;text-align:center}button{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}</style>
</head>
<body>
  <div class="card">
    <h1>Minimal TITAN Dashboard — Demo</h1>
    <p>This preview shows a simplified dashboard UI without authentication.</p>
    <div style="margin-top:18px">
      <button id="refresh-data">Refresh Demo Data</button>
    </div>

    <div id="dashboard" style="margin-top:22px;text-align:left">
      <h3>Statistics</h3>
      <ul id="stats-list">
        <li>Total Records: <strong id="total-records">0</strong></li>
        <li>Success: <strong id="stat-success">0</strong></li>
        <li>Pending: <strong id="stat-pending">0</strong></li>
      </ul>

      <h3 style="margin-top:14px">Recent Entries</h3>
      <table id="demo-table" style="width:100%;border-collapse:collapse;margin-top:8px">
        <thead><tr><th style="text-align:left">Name</th><th>Status</th><th>Service</th></tr></thead>
        <tbody id="demo-rows"></tbody>
      </table>
    </div>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
